<script>
  window.addEventListener('load', () => {
    const marker = document.querySelector('#marker-kounia');
    const audio = document.querySelector('#audioKounia');
    let hasPlayed = false; // Μεταβλητή για να μην ξεκινάει ξανά από την αρχή αν ξαναδεί το marker

    // Απαραίτητο για κινητά (iOS / Android): δίνει άδεια ήχου με το πρώτο άγγιγμα στην οθόνη
    window.addEventListener('click', () => {
      audio.load();
    }, { once: true });

    // Μόλις εντοπιστεί το marker για πρώτη φορά
    marker.addEventListener('markerFound', () => {
      if (!hasPlayed) {
        audio.play();
        hasPlayed = true; // Σημειώνουμε ότι ξεκίνησε
      }
    });

    // ΔΕΝ βάζουμε markerLost listener! 
    // Έτσι, όταν η κάμερα χάσει το marker, ο ήχος ΔΕΝ σταματάει.
  });
</script>
