<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Refugee Museum AR</title>

    <!-- Βιβλιοθήκες A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* Οθόνη Καλωσορίσματος & Οδηγιών */
      #welcomeScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(15, 15, 15, 0.9);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 25px;
        box-sizing: border-box;
      }
      #welcomeScreen h1 {
        color: #ffffff;
        font-family: sans-serif;
        font-size: 22px;
        margin-bottom: 15px;
      }
      #welcomeScreen p {
        color: #dddddd;
        font-family: sans-serif;
        font-size: 15px;
        line-height: 1.5;
        max-width: 400px;
        margin-bottom: 25px;
      }
      #startBtn {
        background-color: #28a745;
        color: #ffffff;
        font-size: 18px;
        font-weight: bold;
        padding: 16px 36px;
        border: none;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        cursor: pointer;
      }

      /* Διακριτική κάρτα καθοδήγησης πάνω από την κάμερα */
      #infoCard {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.75);
        color: #ffffff;
        padding: 12px 22px;
        border-radius: 20px;
        font-family: sans-serif;
        font-size: 14px;
        text-align: center;
        z-index: 9999;
        pointer-events: none;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>

    <!-- Οθόνη Καλωσορίσματος -->
    <div id="welcomeScreen">
      <h1>Refugee Museum AR</h1>
      <p>Καλώς ήρθατε στην ψηφιακή εμπειρία της έκθεσης.<br><br>Πατήστε Έναρξη και στρέψτε την κάμερα προς το χαρακτικό έκθεμα <strong>«Η ΝΕΑ ΖΩΗ»</strong>.</p>
      <button id="startBtn">🔊 Έναρξη Εμπειρίας</button>
    </div>

    <!-- Μήνυμα καθοδήγησης όσο είναι ανοιχτή η κάμερα -->
    <div id="infoCard">Αναζήτηση εκθέματος... Στρέψτε την κάμερα στο σύμβολο.</div>

    <!-- Σκηνή AR με MindAR -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Σημείο 0: Έκθεμα "Η Νέα Ζωή" -->
      <a-entity mindar-image-target="targetIndex: 0" id="exhibit-01">
        
        <!-- Κίνηση λικνίσματος -->
        <a-entity 
          id="cradleRocker" 
          animation="property: rotation; from: -8 0 0; to: 8 0 0; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine">
          
          <!-- 1. Η κούνια (3D Μοντέλο) -->
          <a-entity 
            gltf-model="cradle.glb" 
            scale="0.25 0.25 0.25" 
            position="0 -0.1 0" 
            rotation="0 0 0">
          </a-entity>

          <!-- 2. Το μωράκι -->
          <a-image 
            src="baby.png" 
            position="0 0.05 0.02" 
            scale="0.45 0.45 0.45" 
            material="transparent: true; alphaTest: 0.5;">
          </a-image>

        </a-entity>

      </a-entity>

    </a-scene>

    <!-- Script ελέγχου ήχου, κάμερας & μηνυμάτων -->
    <script>
      const audio = new Audio('kounia.mp3');
      audio.preload = 'auto';

      const welcomeScreen = document.getElementById('welcomeScreen');
      const startBtn = document.getElementById('startBtn');
      const infoCard = document.getElementById('infoCard');
      const sceneEl = document.querySelector('a-scene');
      const target01 = document.querySelector('#exhibit-01');
      let isPlaying = false;

      // Έναρξη εμπειρίας
      startBtn.addEventListener('click', () => {
        welcomeScreen.style.display = 'none';

        // Ξεκλείδωμα ήχου
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
        }).catch(err => console.warn("Audio unlock notice:", err));

        // Εκκίνηση MindAR συστήματος
        sceneEl.systems["mindar-image-system"].start();
      });

      // Όταν εντοπιστεί το σύμβολο "Η Νέα Ζωή"
      target01.addEventListener("targetFound", () => {
        infoCard.innerText = "Έκθεμα: Η Νέα Ζωή (Αναπαραγωγή...)";
        infoCard.style.borderColor = "#28a745";
        
        if (!isPlaying) {
          audio.play().then(() => {
            isPlaying = true;
          }).catch(err => console.error("Audio error:", err));
        }
      });

      // Όταν απομακρυνθεί η κάμερα
      target01.addEventListener("targetLost", () => {
        infoCard.innerText = "Αναζήτηση εκθέματος... Στρέψτε την κάμερα στο σύμβολο.";
        infoCard.style.borderColor = "rgba(255, 255, 255, 0.2)";
        
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        }
      });
    </script>
  </body>
</html>
