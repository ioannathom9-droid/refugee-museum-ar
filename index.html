<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Refugee Museum AR</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      video {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -2 !important;
      }
      /* Σταθερή οθόνη εκκίνησης που ΔΕΝ κλείνει μόνη της */
      #startScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(10, 10, 10, 0.92);
        z-index: 9999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #startScreen h1 {
        color: #ffffff;
        font-family: sans-serif;
        font-size: 22px;
        margin-bottom: 25px;
      }
      #playButton {
        background-color: #28a745;
        color: #ffffff;
        font-size: 20px;
        font-weight: bold;
        padding: 18px 36px;
        border: none;
        border-radius: 40px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- Οθόνη με μεγάλο πράσινο κουμπί -->
    <div id="startScreen">
      <h1>Refugee Museum AR</h1>
      <button id="playButton">🔊 Πατήστε εδώ για Έναρξη</button>
    </div>

    <a-scene 
      embedded 
      arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
      
      <!-- Marker Hiro -->
      <a-marker preset="hiro" id="myMarker">
        <a-box position="0 0.5 0" material="color: #00ff00; opacity: 0.8;"></a-box>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Φόρτωση του αρχείου ήχου
      const audio = new Audio('kounia.mp3');
      audio.preload = 'auto';

      const startScreen = document.getElementById('startScreen');
      const playButton = document.getElementById('playButton');
      const marker = document.getElementById('myMarker');
      let soundUnlocked = false;

      // Μόνο όταν πατηθεί το κουμπί ξεκλειδώνει ο ήχος και ανοίγει η κάμερα
      playButton.addEventListener('click', () => {
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
          soundUnlocked = true;
          startScreen.style.display = 'none';
        }).catch(() => {
          soundUnlocked = true;
          startScreen.style.display = 'none';
        });
      });

      // Όταν αναγνωριστεί το marker
      marker.addEventListener('markerFound', () => {
        if (soundUnlocked) {
          audio.play().catch(err => console.error("Playback error: ", err));
        }
      });
    </script>
  </body>
</html>
