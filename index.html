<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Refugee Museum AR</title>

    <!-- Βιβλιοθήκες A-Frame και AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      video {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -2 !important;
      }
      /* Οθόνη εκκίνησης */
      #startScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(10, 10, 10, 0.85);
        z-index: 9999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #startScreen h1 {
        color: #ffffff;
        font-family: sans-serif;
        font-size: 22px;
        margin-bottom: 25px;
      }
      #playButton {
        background-color: #28a745;
        color: #ffffff;
        font-size: 20px;
        font-weight: bold;
        padding: 18px 36px;
        border: none;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- Οθόνη για το αρχικό πάτημα -->
    <div id="startScreen">
      <h1>Refugee Museum AR</h1>
      <button id="playButton">🔊 Πατήστε εδώ για Έναρξη</button>
    </div>

    <a-scene 
      embedded 
      arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
      
      <!-- Φωτισμός για σωστή απεικόνιση των χρωμάτων -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 1.0" position="-1 2 1"></a-entity>

      <!-- Custom Marker -->
      <a-marker type="pattern" url="kounia.patt" id="myMarker">
        
        <!-- 
          Η τρισδιάστατη κούνια:
          - scale: αυξήθηκε σε 1.2 για να φαίνεται σε καλό μέγεθος
          - rotation: περιστροφή -90 μοίρες στον άξονα X για να σταθεί όρθια πάνω στο marker
        -->
        <a-entity 
         <!-- Κούνια με κίνηση μπρος-πίσω (άξονας X) -->
       <a-entity 
          id="cradleModel"
          gltf-model="cradle.glb"
          scale="1.2 1.2 1.2"
          position="0 0 0"
          rotation="-90 0 0"
          animation="property: rotation; from: -90 -8 0; to: -90 8 0; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine">
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const audio = new Audio('kounia.mp3');
      audio.preload = 'auto';

      const startScreen = document.getElementById('startScreen');
      const playButton = document.getElementById('playButton');
      const marker = document.getElementById('myMarker');
      let isPlaying = false;

      // Κλείσιμο οθόνης ΑΜΕΣΩΣ με το κλικ
      playButton.addEventListener('click', () => {
        startScreen.style.display = 'none';

        // Προετοιμασία ήχου
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
        }).catch(err => {
          console.warn("Audio unlock notice:", err);
        });
      });

      // Μόλις εντοπιστεί το marker
      marker.addEventListener('markerFound', () => {
        if (!isPlaying) {
          audio.play().then(() => {
            isPlaying = true;
          }).catch(err => {
            console.error("Audio play error:", err);
          });
        }
      });

      // Αν χαθεί το marker
      marker.addEventListener('markerLost', () => {
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        }
      });
    </script>
  </body>
</html>
