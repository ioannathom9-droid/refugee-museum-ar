<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Refugee Museum AR</title>

    <!-- Βιβλιοθήκες A-Frame και AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      /* Σωστή προβολή κάμερας χωρίς παραμόρφωση για συσκευές Poco */
      video {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -2 !important;
      }
      /* Οθόνη εκκίνησης */
      #startScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(10, 10, 10, 0.9);
        z-index: 9999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #startScreen h1 {
        color: #ffffff;
        font-family: sans-serif;
        font-size: 22px;
        margin-bottom: 25px;
      }
      #playButton {
        background-color: #28a745;
        color: #ffffff;
        font-size: 20px;
        font-weight: bold;
        padding: 18px 36px;
        border: none;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- Οθόνη για το αρχικό πάτημα -->
    <div id="startScreen">
      <h1>Refugee Museum AR</h1>
      <button id="playButton">🔊 Πατήστε εδώ για Έναρξη</button>
    </div>

    <a-scene 
      embedded 
      arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
      
      <!-- Το δικό σας Custom Marker χωρίς κανένα 3D αντικείμενο/κύβο -->
      <a-marker type="pattern" url="kounia.patt" id="myMarker"></a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const audio = new Audio('kounia.mp3');
      audio.preload = 'auto';

      const startScreen = document.getElementById('startScreen');
      const playButton = document.getElementById('playButton');
      const marker = document.getElementById('myMarker');
      let soundUnlocked = false;
      let isPlaying = false;

      // Ξεκλείδωμα ήχου με το πάτημα του κουμπιού
      playButton.addEventListener('click', () => {
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
          soundUnlocked = true;
          startScreen.style.display = 'none';
        }).catch(err => {
          console.error("Audio error:", err);
          soundUnlocked = true;
          startScreen.style.display = 'none';
        });
      });

      // Μόλις η κάμερα δει το δικό σας marker
      marker.addEventListener('markerFound', () => {
        if (soundUnlocked && !isPlaying) {
          audio.play().then(() => {
            isPlaying = true;
          }).catch(err => {
            console.error("Play error:", err);
          });
        }
      });
    </script>
  </body>
</html>
