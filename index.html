<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Refugee Museum AR</title>

    <!-- Σταθερές εκδόσεις A-Frame & AR.js NFT -->
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c40837/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #startScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(10, 10, 10, 0.9);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #startScreen h1 {
        color: #ffffff;
        font-family: sans-serif;
        font-size: 22px;
        margin-bottom: 25px;
      }
      #playButton {
        background-color: #28a745;
        color: #ffffff;
        font-size: 20px;
        font-weight: bold;
        padding: 18px 36px;
        border: none;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- Ένδειξη φόρτωσης -->
    <div class="arjs-loader" id="loader">
      <div>Φόρτωση δεδομένων εκθέματος...<br>Παρακαλώ περιμένετε λίγα δευτερόλεπτα.</div>
    </div>

    <!-- Οθόνη εκκίνησης -->
    <div id="startScreen">
      <h1>Refugee Museum AR</h1>
      <button id="playButton">🔊 Πατήστε εδώ για Έναρξη</button>
    </div>

    <!-- Σκηνή AR -->
    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

      <!-- NFT Marker -->
      <a-nft
        id="myMarker"
        type="nft"
        url="https://ioannathom9-droid.github.io/refugee-museum-ar/markers/01-newborn/baby"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">

        <!-- Στοιχείο λικνίσματος -->
        <a-entity
          id="cradleRocker"
          position="50 150 -100"
          rotation="0 0 0"
          animation="property: rotation; from: -8 0 0; to: 8 0 0; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine">

          <!-- 1. Κούνια -->
          <a-entity
            id="cradleModel"
            gltf-model="cradle.glb"
            scale="100 100 100"
            rotation="-90 0 0"
            position="0 0 0">
          </a-entity>

          <!-- 2. Μωρό -->
          <a-image
            id="babyImage"
            src="baby.png"
            position="0.2 25 -10"
            rotation="-90 0 90"
            scale="180 180 180"
            width="0.7"
            height="1.1"
            material="transparent: true; alphaTest: 0.5;">
          </a-image>

        </a-entity>

      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const audio = new Audio('kounia.mp3');
      audio.preload = 'auto';

      const startScreen = document.getElementById('startScreen');
      const playButton = document.getElementById('playButton');
      const loader = document.getElementById('loader');
      const marker = document.getElementById('myMarker');
      let isPlaying = false;

      // Ασφαλής αφαίρεση loader
      function hideLoader() {
        if (loader) {
          loader.style.display = 'none';
        }
      }

      window.addEventListener('arjs-nft-loaded', hideLoader);

      // Εφεδρικός χρονοδιακόπτης: αν το event αργήσει, ο loader κλείνει αυτόματα στα 8 δευτερόλεπτα
      setTimeout(hideLoader, 8000);

      playButton.addEventListener('click', () => {
        startScreen.style.display = 'none';

        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
        }).catch(err => {
          console.warn("Audio unlock notice:", err);
        });
      });

      marker.addEventListener('markerFound', () => {
        if (!isPlaying) {
          audio.play().then(() => {
            isPlaying = true;
          }).catch(err => {
            console.error("Audio play error:", err);
          });
        }
      });

      marker.addEventListener('markerLost', () => {
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        }
      });
    </script>
  </body>
</html>
