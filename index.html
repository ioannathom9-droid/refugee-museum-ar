<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Refugee Museum AR</title>

    <!-- Βιβλιοθήκες A-Frame και AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      /* Προσαρμογή βίντεο κάμερας σε πλήρη οθόνη χωρίς παραμορφώσεις */
      video {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -2 !important;
      }
      /* Αρχική οθόνη για ξεκλείδωμα του ήχου στα κινητά */
      #startScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(10, 10, 10, 0.9);
        z-index: 9999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #startScreen h1 {
        color: #ffffff;
        font-family: sans-serif;
        font-size: 22px;
        margin-bottom: 25px;
      }
      #playButton {
        background-color: #28a745;
        color: #ffffff;
        font-size: 20px;
        font-weight: bold;
        padding: 18px 36px;
        border: none;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- Οθόνη έναρξης -->
    <div id="startScreen">
      <h1>Refugee Museum AR</h1>
      <button id="playButton">🔊 Πατήστε εδώ για Έναρξη</button>
    </div>

    <!-- Σκηνή AR -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
      
      <!-- Custom Marker (kounia.patt) -->
      <a-marker type="pattern" url="kounia.patt" id="myMarker">
        
        <!-- 
          3D Μοντέλο Κούνιας:
          - gltf-model: το αρχείο cradle.glb
          - animation: κίνηση λικνίσματος πέρα-δώθε (-7° έως +7°)
        -->
        <a-entity 
          id="cradleModel"
          gltf-model="cradle.glb"
          scale="0.25 0.25 0.25"
          position="0 0 0"
          rotation="0 0 0"
          animation="property: rotation; from: 0 0 -7; to: 0 0 7; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine">
        </a-entity>

      </a-marker>

      <!-- Κάμερα A-Frame -->
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Ήχος νανουρίσματος
      const audio = new Audio('kounia.mp3');
      audio.preload = 'auto';

      const startScreen = document.getElementById('startScreen');
      const playButton = document.getElementById('playButton');
      const marker = document.getElementById('myMarker');
      let soundUnlocked = false;
      let isPlaying = false;

      // Ξεκλείδωμα ήχου με το πάτημα του κουμπιού
      playButton.addEventListener('click', () => {
        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
          soundUnlocked = true;
          startScreen.style.display = 'none';
        }).catch(err => {
          console.error("Audio error:", err);
          soundUnlocked = true;
          startScreen.style.display = 'none';
        });
      });

      // Όταν η κάμερα εντοπίσει το marker
