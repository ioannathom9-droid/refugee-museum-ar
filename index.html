<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Refugee Museum AR</title>

    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      video {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -2 !important;
      }
      /* Πλήρης επικάλυψη για ένα απλό άγγιγμα οπουδήποτε στην οθόνη */
      #tapOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-family: sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #tapOverlay h2 {
        font-size: 22px;
        margin-bottom: 10px;
      }
      #tapOverlay p {
        font-size: 16px;
        color: #00ff00;
      }
    </style>
  </head>
  <body>

    <!-- Οθόνη ενεργοποίησης: πατάτε οπουδήποτε -->
    <div id="tapOverlay">
      <h2>Refugee Museum AR</h2>
      <p>👉 Αγγίξτε οπουδήποτε στην οθόνη για να ξεκινήσετε 👈</p>
    </div>

    <a-scene 
      embedded 
      arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
      
      <a-assets>
        <audio id="audioSource" src="kounia.mp3" preload="auto"></audio>
      </a-assets>

      <!-- Το Marker Hiro με τον ήχο ενσωματωμένο -->
      <a-marker preset="hiro" id="myMarker">
        <a-box position="0 0.5 0" material="color: #00ff00; opacity: 0.8;"></a-box>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const overlay = document.getElementById('tapOverlay');
      const audioElement = document.getElementById('audioSource');
      const marker = document.getElementById('myMarker');
      let soundActive = false;

      // Με ένα άγγιγμα οπουδήποτε ξεκλειδώνει ο ήχος και φεύγει η οθόνη
      overlay.addEventListener('click', () => {
        audioElement.play().then(() => {
          audioElement.pause();
          audioElement.currentTime = 0;
          soundActive = true;
          overlay.style.display = 'none';
        }).catch(err => {
          console.error("Audio error:", err);
          soundActive = true;
          overlay.style.display = 'none';
        });
      });

      // Όταν εμφανιστεί το marker, παίζει ο ήχος
      marker.addEventListener('markerFound', () => {
        if (soundActive) {
          audioElement.play().catch(e => console.error(e));
        }
      });
    </script>
  </body>
</html>
