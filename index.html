<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Μουσείο Προσφυγικής Μνήμης 1922 - Σκάλα Λουτρών</title>

    <!-- Βιβλιοθήκες A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #706C62; }
      
      /* Οθόνη Καλωσορίσματος */
      #welcomeScreen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #706C62; z-index: 10000;
        display: flex; flex-direction: column; justify-content: space-around; align-items: center;
        overflow-y: auto; padding: 6px 20px 15px 20px; box-sizing: border-box;
      }

      .header-section {
        text-align: center; color: #fff; width: 100%; margin-top: 0;
      }
      .header-section img {
        width: 82px; height: auto; margin-bottom: 4px;
      }
      .header-section h2 {
        font-size: 19px; line-height: 1.25; margin: 2px 0; font-weight: bold;
      }
      .badge-box {
        border: 1.5px solid #C49B55; border-radius: 10px; padding: 6px 14px;
        display: inline-block; color: #EEDDBB; font-size: 13.5px; font-weight: 500;
        margin-top: 12px; background-color: transparent; text-align: center; line-height: 1.35;
      }

      .features-wrapper {
        width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 10px;
        margin: 2px 0;
      }
      .feature-card {
        background-color: #2D2321; border: 1.5px solid #3d312e; border-radius: 14px;
        padding: 9px 14px; width: 100%; box-sizing: border-box;
        display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      }
      .feature-icon {
        width: 38px; height: 38px; background-color: #C49B55; border-radius: 10px;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        font-size: 18px;
      }
      .feature-text h3 {
        color: #fff; font-size: 16px; margin: 0 0 2px 0; font-weight: bold;
      }
      .feature-text p {
        color: #E2DCD6; font-size: 13px; margin: 0; line-height: 1.25;
      }

      .cta-container {
        text-align: center; width: 100%; max-width: 390px; margin-bottom: 10px;
      }
      #startBtn {
        background-color: #9A2B27; color: #fff; font-size: 18px; font-weight: bold;
        padding: 15px 24px; width: 100%; border: 1.5px solid #C49B55; border-radius: 38px;
        cursor: pointer; box-shadow: 0 5px 18px rgba(0,0,0,0.45);
      }
      .cta-subtext {
        color: #E2DCD6; font-size: 11.5px; margin-top: 8px; line-height: 1.3;
      }

      /* Σταθερό 2D Πλαίσιο Προβολής Βίντεο (για τον Γάμο) */
      #videoOverlayContainer {
        position: fixed; top: 44%; left: 50%; transform: translate(-50%, -50%);
        width: 78vw; max-width: 320px; max-height: 62vh;
        border: 2.5px solid #C49B55; border-radius: 16px;
        overflow: hidden; background-color: #000;
        box-shadow: 0 8px 30px rgba(0,0,0,0.8);
        z-index: 9995; display: none;
      }
      #videoOverlayContainer video {
        width: 100%; height: auto; display: none; object-fit: contain;
      }

      /* Μεγάλο κεντρικό μήνυμα για τα κειμήλια (Χωρίς κουμπί Χ) */
      #infoCard {
        position: fixed; top: 32%; left: 50%; transform: translateX(-50%);
        background-color: rgba(45, 35, 33, 0.98); color: #fff; padding: 24px;
        border-radius: 18px; font-size: 16.5px; text-align: center;
        z-index: 9999; border: 2.5px solid #E5C158;
        width: 90vw; max-width: 380px; box-shadow: 0 0 30px rgba(0,0,0,0.9);
        display: none; line-height: 1.6; font-weight: bold;
      }

      /* ΚΑΤΩ ΜΠΑΡΑ (Συνδυασμός Pause & Συλλογής) */
      #bottomContainer {
        position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px; z-index: 9999; display: none;
      }

      #pausePlayBtn {
        background-color: #9A2B27; color: white; border: 2px solid #C49B55; border-radius: 50%;
        width: 52px; height: 52px; font-size: 20px; font-weight: bold; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 10px rgba(196,155,85,0.4);
        flex-shrink: 0;
      }

      #bottomTray {
        background-color: rgba(35, 28, 26, 0.96); padding: 14px 26px;
        border-radius: 28px; display: flex; align-items: center; justify-content: center;
        border: 2.5px solid #E5C158; cursor: pointer;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5), 0 0 12px rgba(229,193,88,0.4);
      }
      .tray-info-text {
        color: #FFFFFF; font-size: 16px; font-weight: bold; letter-spacing: 0.4px; white-space: nowrap;
      }

      /* Equalizer Bar (στη μέση της οθόνης για το ηχητικό του Γάμου) */
      #equalizerBar {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background-color: rgba(45, 35, 33, 0.95); padding: 12px 22px;
