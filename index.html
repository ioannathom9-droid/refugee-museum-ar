<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Refugee Museum AR</title>

    <!-- Βιβλιοθήκες A-Frame και AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* Διόρθωση μεγέθους κάμερας για κινητά Poco / Xiaomi */
      video {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -2 !important;
      }

      /* Κουμπί εκκίνησης ήχου */
      #startBtn {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999999;
        padding: 16px 32px;
        background-color: #007bff;
        color: #ffffff;
        border: none;
        border-radius: 30px;
        font-size: 18px;
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        cursor: pointer;
      }

      /* Μήνυμα κατάστασης στην κορυφή */
      #statusMsg {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 999999;
        background: rgba(0, 0, 0, 0.85);
        color: #ffff00;
        padding: 12px 24px;
        border-radius: 8px;
        font-family: sans-serif;
        font-size: 15px;
        font-weight: bold;
        display: none;
        text-align: center;
        max-width: 85%;
      }
    </style>
  </head>
  <body>

    <div id="statusMsg">Αναμονή...</div>
    <button id="startBtn">Πατήστε εδώ για Έναρξη</button>

    <!-- Σκηνή AR με κλείδωμα ανάλυσης 16:9 για αποφυγή παραμόρφωσης -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
      
      <!-- Marker Hiro -->
      <a-marker preset="hiro" id="targetMarker"></a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      
      const audio = new Audio('https://actions.google.com/sounds/v1/ambiences/outdoor_meadow_wind.ogg');

audio.preload = 'auto';

      const startBtn = document.getElementById('startBtn');
      const statusMsg = document.getElementById('statusMsg');
      const marker = document.getElementById('targetMarker');

      let userInteracted = false;
      let hasStarted = false;

      // Έλεγχος σφάλματος αν δεν βρίσκει το MP3
      audio.addEventListener('error', () => {
        statusMsg.style.display = 'block';
        statusMsg.style.color = '#ff3333';
        statusMsg.innerText = 'Σφάλμα: Δεν βρέθηκε το αρχείο kounia.mp3!';
      });

      // Πάτημα κουμπιού για άδεια ήχου
      startBtn.addEventListener('click', () => {
        userInteracted = true;
        audio.load();
        startBtn.style.display = 'none';

        statusMsg.style.display = 'block';
        statusMsg.style.color = '#ffff00';
        statusMsg.innerText = 'Έτοιμο! Σημαδέψτε το Marker Hiro.';
      });

      // Εντοπισμός marker
      marker.addEventListener('markerFound', () => {
        if (!userInteracted) {
          statusMsg.style.display = 'block';
          statusMsg.style.color = '#ff9900';
          statusMsg.innerText = 'Πατήστε πρώτα το κουμπί Έναρξης!';
          return;
        }

        if (!hasStarted) {
          audio.play().then(() => {
            hasStarted = true;
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#00ff00';
            statusMsg.innerText = 'Αναπαραγωγή ήχου...';
          }).catch(err => {
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#ff3333';
            statusMsg.innerText = 'Σφάλμα αναπαραγωγής: ' + err.message;
          });
        }
      });
    </script>
  </body>
</html>
