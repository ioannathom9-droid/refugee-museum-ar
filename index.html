<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <title>Inspector Preview</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>body { margin: 0; overflow: hidden; background: #222; }</style>
  </head>
  <body>
    <a-scene>
      <!-- Κάμερα -->
      <a-entity camera look-controls wasd-controls position="0 0.5 1.5"></a-entity>

      <!-- Φωτισμός -->
      <a-entity light="type: ambient; intensity: 1.5"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>

      <!-- Σύστημα Κούνιας & Μωρού (Ελεύθερο στη σκηνή) -->
      <a-entity id="cradleRocker" position="0 0 0">
        
        <!-- 1. Κούνια -->
        <a-entity 
          id="cradleModel"
          gltf-model="cradle.glb" 
          scale="0.5 0.5 0.5" 
          position="0 0 0" 
          rotation="0 90 0">
        </a-entity>

        <!-- 2. Μωρό -->
        <a-image 
          id="babyImage"
          src="baby.png" 
          position="0.005 0.08 0.05" 
          rotation="-90 0 0" 
          scale="0.8 0.8 0.8" 
          width="0.7"
          height="1.1"
          material="transparent: true; alphaTest: 0.5;">
        </a-image>

      </a-entity>
    </a-scene>
  </body>
</html>
