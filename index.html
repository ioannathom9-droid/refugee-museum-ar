<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Refugee Museum AR</title>

    <!-- Βιβλιοθήκες A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

      /* Οθόνη Καλωσορίσματος */
      #welcomeScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(15, 15, 15, 0.95);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 25px;
        box-sizing: border-box;
      }
      #welcomeScreen h1 {
        color: #ffffff;
        font-family: sans-serif;
        font-size: 22px;
        margin-bottom: 15px;
      }
      #welcomeScreen p {
        color: #dddddd;
        font-family: sans-serif;
        font-size: 15px;
        line-height: 1.5;
        max-width: 400px;
        margin-bottom: 25px;
      }
      #startBtn {
        background-color: #28a745;
        color: #ffffff;
        font-size: 18px;
        font-weight: bold;
        padding: 16px 36px;
        border: none;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        cursor: pointer;
      }

      /* Κάρτα καθοδήγησης */
      #infoCard {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        background-color: rgba(0, 0, 0, 0.85);
        color: #ffffff;
        padding: 12px 24px;
        border-radius: 25px;
        font-family: sans-serif;
        font-size: 14px;
        text-align: center;
        z-index: 9999;
        border: 1px solid rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        gap: 12px;
      }

      /* Κουμπί επαναφοράς / επόμενου εκθέματος */
      #closeBtn {
        background-color: #dc3545;
        color: white;
        border: none;
        border-radius: 15px;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        display: none;
      }
    </style>
  </head>
  <body>

    <!-- Οθόνη Καλωσορίσματος -->
    <div id="welcomeScreen">
      <h1>Refugee Museum AR</h1>
      <p>Καλώς ήρθατε στην ψηφιακή εμπειρία της έκθεσης.<br><br>Πατήστε Έναρξη και στρέψτε την κάμερα προς οποιοδήποτε έκθεμα.</p>
      <button id="startBtn">▶ Έναρξη Εμπειρίας</button>
    </div>

    <!-- Μπάρα Καθοδήγησης & Κουμπί Επόμενου -->
    <div id="infoCard">
      <span id="infoText">Αναζήτηση εκθέματος... Στρέψτε την κάμερα στο σύμβολο.</span>
      <button id="closeBtn">Επόμενο ✕</button>
    </div>

    <!-- Σκηνή AR -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- Προφόρτωση βίντεο στα assets -->
      <a-assets>
        <video id="videoPappous" src="pappous_v5.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
        <video id="videoPoulos" src="poulos.mp4" preload="auto" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Έκθεμα 1: Η Νέα Ζωή (targetIndex: 0) -->
      <a-entity mindar-image-target="targetIndex: 0" id="newborn"></a-entity>

      <!-- Έκθεμα 2: Παππούς (targetIndex: 1) -->
      <a-entity mindar-image-target="targetIndex: 1" id="pappous">
        <a-video src="#videoPappous" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Έκθεμα 3: Πούλος (targetIndex: 2) -->
      <a-entity mindar-image-target="targetIndex: 2" id="poulos">
        <a-video src="#videoPoulos" width="1" height="0.5625" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>

      <!-- Υπόλοιπα Εκθέματα -->
      <a-entity mindar-image-target="targetIndex: 3" id="raptomihani"></a-entity>
      <a-entity mindar-image-target="targetIndex: 4" id="smirni"></a-entity>
      <a-entity mindar-image-target="targetIndex: 5" id="vaptisi"></a-entity>
      <a-entity mindar-image-target="targetIndex: 6" id="amaltheia"></a-entity>
      <a-entity mindar-image-target="targetIndex: 7" id="filia"></a-entity>
      <a-entity mindar-image-target="targetIndex: 8" id="gamos"></a-entity>

    </a-scene>

    <script>
      const welcomeScreen = document.getElementById('welcomeScreen');
      const startBtn = document.getElementById('startBtn');
      const infoText = document.getElementById('infoText');
      const closeBtn = document.getElementById('closeBtn');
      const sceneEl = document.querySelector('a-scene');

      const targetPappous = document.querySelector('#pappous');
      const targetPoulos = document.querySelector('#poulos');

      const videoPappous = document.querySelector('#videoPappous');
      const videoPoulos = document.querySelector('#videoPoulos');

      let currentActiveVideo = null;

      // Έναρξη AR & "Ξεκλείδωμα" ήχου/βίντεο για κινητά
      startBtn.addEventListener('click', () => {
        welcomeScreen.style.display = 'none';

        [videoPappous, videoPoulos].forEach(v => {
          v.play().then(() => {
            v.pause();
            v.currentTime = 0;
          }).catch(err => console.warn("Video unlock notice:", err));
        });

        sceneEl.systems["mindar-image-system"].start();
      });

      // 1. Εντοπισμός: Παππούς
      targetPappous.addEventListener("targetFound", () => {
        stopAllVideos();
        infoText.innerText = "Έκθεμα: Παππούς";
        closeBtn.style.display = "inline-block";
        videoPappous.play();
        currentActiveVideo = videoPappous;
      });

      targetPappous.addEventListener("targetLost", () => {
        videoPappous.pause();
      });

      // 2. Εντοπισμός: Πούλος
      targetPoulos.addEventListener("targetFound", () => {
        stopAllVideos();
        infoText.innerText = "Έκθεμα: Πούλος";
        closeBtn.style.display = "inline-block";
        videoPoulos.play();
        currentActiveVideo = videoPoulos;
      });

      targetPoulos.addEventListener("targetLost", () => {
        videoPoulos.pause();
      });

      // Κουμπί επαναφοράς "Επόμενο"
      closeBtn.addEventListener('click', () => {
        stopAllVideos();
        closeBtn.style.display = "none";
        infoText.innerText = "Αναζήτηση εκθέματος... Στρέψτε την κάμερα στο σύμβολο.";
      });

      function stopAllVideos() {
        [videoPappous, videoPoulos].forEach(v => {
          v.pause();
          v.currentTime = 0;
        });
        currentActiveVideo = null;
      }
    </script>
  </body>
</html>
