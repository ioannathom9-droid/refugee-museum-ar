<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Refugee Museum AR</title>

    <!-- Βιβλιοθήκες A-Frame και AR.js (έκδοση ειδικά για NFT) -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      video {
        width: 100vw !important;
        height: 100vh !important;
        object-fit: cover !important;
        position: absolute;
        top: 0;
        left: 0;
        z-index: -2 !important;
      }
      /* Οθόνη έναρξης για ήχο */
      #startScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(10, 10, 10, 0.85);
        z-index: 9999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #startScreen h1 {
        color: #ffffff;
        font-family: sans-serif;
        font-size: 22px;
        margin-bottom: 25px;
      }
      #playButton {
        background-color: #28a745;
        color: #ffffff;
        font-size: 20px;
        font-weight: bold;
        padding: 18px 36px;
        border: none;
        border-radius: 40px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        cursor: pointer;
      }
      /* Οθόνη φόρτωσης του NFT Marker */
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>

    <!-- Μήνυμα φόρτωσης μέχρι να διαβαστούν τα αρχεία baby.* -->
    <div class="arjs-loader">
      <div>Φόρτωση δεδομένων εκθέματος... Παρακαλώ περιμένετε.</div>
    </div>

    <!-- Οθόνη εκκίνησης -->
    <div id="startScreen">
      <h1>Refugee Museum AR</h1>
      <button id="playButton">🔊 Πατήστε εδώ για Έναρξη</button>
    </div>

    <!-- Σκηνή AR -->
    <a-scene 
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      embedded 
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Φωτισμός -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 1.0" position="-1 2 1"></a-entity>

      <!-- NFT Marker: Η Νέα Ζωή (διαδρομή markers/01-newborn/baby) -->
      <a-nft
        id="myMarker"
        type="nft"
        url="./markers/01-newborn/baby"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">
        
        <!-- Εξωτερικό στοιχείο: Λίκνισμα πάνω στα πέδιλα -->
        <a-entity 
          id="cradleRocker"
          position="100 100 -200"
          rotation="0 0 0"
          animation="property: rotation; from: -8 0 0; to: 8 0 0; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine">

          <!-- 1. Η κούνια -->
          <a-entity 
            id="cradleModel"
            gltf-model="cradle.glb"
            scale="100 100 100"
            rotation="-90 0 0"
            position="0 0 0">
          </a-entity>

          <!-- 2. Το φασκιωμένο μωρό -->
          <a-image 
            id="babyImage"
            src="baby.png"
            position="0.2 25 -10"
            rotation="-90 0 90"
            scale="180 180 180"
            width="0.7"
            height="1.1"
            material="transparent: true; alphaTest: 0.5;">
          </a-image>

        </a-entity>

      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <!-- JavaScript για ήχο, loader και έναρξη -->
    <script>
      const audio = new Audio('kounia.mp3');
      audio.preload = 'auto';

      const startScreen = document.getElementById('startScreen');
      const playButton = document.getElementById('playButton');
      const marker = document.getElementById('myMarker');
      let isPlaying = false;

      // Εξαφάνιση του loader μόλις φορτωθεί το NFT marker
      window.addEventListener('arjs-nft-loaded', function(ev) {
        const loader = document.querySelector('.arjs-loader');
        if (loader) {
          loader.style.display = 'none';
        }
      });

      // Έναρξη και ξεκλείδωμα ήχου
      playButton.addEventListener('click', () => {
        startScreen.style.display = 'none';

        audio.play().then(() => {
          audio.pause();
          audio.currentTime = 0;
        }).catch(err => {
          console.warn("Audio unlock notice:", err);
        });
      });

      // Μόλις εντοπιστεί ο marker στην κάμερα
      marker.addEventListener('markerFound', () => {
        if (!isPlaying) {
          audio.play().then(() => {
            isPlaying = true;
          }).catch(err => {
            console.error("Audio play error:", err);
          });
        }
      });

      // Όταν χαθεί ο marker
      marker.addEventListener('markerLost', () => {
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
        }
      });
    </script>
  </body>
</html>
