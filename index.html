<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Μουσείο Προσφυγικής Μνήμης 1922 - Σκάλα Λουτρών</title>

    <!-- Βιβλιοθήκες A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #706C62; }
      
      /* Οθόνη Καλωσορίσματος */
      #welcomeScreen {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: #706C62; z-index: 10000;
        display: flex; flex-direction: column; justify-content: space-around; align-items: center;
        overflow-y: auto; padding: 15px 20px; box-sizing: border-box;
      }

      .header-section {
        text-align: center; color: #fff; width: 100%;
      }
      .header-section img {
        width: 110px; height: auto; margin-bottom: 6px;
      }
      .header-section h2 {
        font-size: 19px; line-height: 1.25; margin: 4px 0; font-weight: bold;
      }
      .badge-box {
        border: 1.5px solid #C49B55; border-radius: 10px; padding: 8px 16px;
        display: inline-block; color: #EEDDBB; font-size: 13.5px; font-weight: 500;
        margin-top: 8px; background-color: transparent; text-align: center; line-height: 1.4;
      }

      .features-wrapper {
        width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 10px;
      }
      .feature-card {
        background-color: #2D2321; border: 1.5px solid #3d312e; border-radius: 16px;
        padding: 14px 16px; width: 100%; box-sizing: border-box;
        display: flex; align-items: center; gap: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      }
      .feature-icon {
        width: 44px; height: 44px; background-color: #C49B55; border-radius: 10px;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        font-size: 20px;
      }
      .feature-text h3 {
        color: #fff; font-size: 16px; margin: 0 0 3px 0; font-weight: bold;
      }
      .feature-text p {
        color: #E2DCD6; font-size: 13px; margin: 0; line-height: 1.35;
      }

      .cta-container {
        text-align: center; width: 100%; max-width: 390px; margin-bottom: 10px;
      }
      #startBtn {
        background-color: #9A2B27; color: #fff; font-size: 18px; font-weight: bold;
        padding: 15px 24px; width: 100%; border: 1.5px solid #C49B55; border-radius: 38px;
        cursor: pointer; box-shadow: 0 5px 18px rgba(0,0,0,0.45);
      }
      .cta-subtext {
        color: #E2DCD6; font-size: 11.5px; margin-top: 8px; line-height: 1.3;
      }

      /* Μεγάλο κεντρικό μήνυμα για τα κειμήλια (Χωρίς κουμπί Χ) */
      #infoCard {
        position: fixed; top: 32%; left: 50%; transform: translateX(-50%);
        background-color: rgba(45, 35, 33, 0.98); color: #fff; padding: 24px;
        border-radius: 18px; font-size: 16.5px; text-align: center;
        z-index: 9999; border: 2.5px solid #E5C158;
        width: 90vw; max-width: 380px; box-shadow: 0 0 30px rgba(0,0,0,0.9);
        display: none; line-height: 1.6; font-weight: bold;
      }

      /* ΚΑΤΩ ΜΠΑΡΑ (Συνδυασμός Pause & Συλλογής) */
      #bottomContainer {
        position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
        display: flex; align-items: center; gap: 10px; z-index: 9999; display: none;
      }

      #pausePlayBtn {
        background-color: #9A2B27; color: white; border: 2px solid #C49B55; border-radius: 50%;
        width: 52px; height: 52px; font-size: 20px; font-weight: bold; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 10px rgba(196,155,85,0.4);
        flex-shrink: 0;
      }

      #bottomTray {
        background-color: rgba(35, 28, 26, 0.96); padding: 14px 26px;
        border-radius: 28px; display: flex; align-items: center; justify-content: center;
        border: 2.5px solid #E5C158; cursor: pointer;
        box-shadow: 0 6px 20px rgba(0,0,0,0.5), 0 0 12px rgba(229,193,88,0.4);
      }
      .tray-info-text {
        color: #FFFFFF; font-size: 16px; font-weight: bold; letter-spacing: 0.4px; white-space: nowrap;
      }

      /* Equalizer Bar (εμφανίζεται μόνο στο ηχητικό) */
      #equalizerBar {
        position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
        background-color: rgba(45, 35, 33, 0.95); padding: 8px 18px;
        border-radius: 20px; display: flex; align-items: center; gap: 8px;
        z-index: 9999; border: 1.5px solid #C49B55; display: none;
      }
      .equalizer {
        display: flex; align-items: flex-end; gap: 4px; height: 18px;
      }
      .equalizer span {
        width: 4px; background-color: #C49B55; border-radius: 2px;
        animation: bounce 0.8s infinite ease-in-out alternate;
      }
      .equalizer span:nth-child(2) { animation-delay: 0.2s; }
      .equalizer span:nth-child(3) { animation-delay: 0.4s; }
      .equalizer span:nth-child(4) { animation-delay: 0.1s; }
      .equalizer span:nth-child(5) { animation-delay: 0.3s; }
      @keyframes bounce {
        0% { height: 4px; }
        100% { height: 18px; }
      }

      /* MODAL (3-1-3) */
      #exhibitsModal {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background-color: rgba(25, 20, 18, 0.98); z-index: 20000;
        display: none; flex-direction: column; padding: 20px; box-sizing: border-box;
        overflow-y: auto; justify-content: space-between;
      }
      .modal-header {
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 1px solid rgba(196,155,85,0.3); padding-bottom: 12px; margin-bottom: 10px;
        flex-shrink: 0; width: 100%; max-width: 400px; margin-left: auto; margin-right: auto;
      }
      .modal-header h3 { color: #E5C158; margin: 0; font-size: 20px; }
      #modalCloseBtn {
        background-color: #9A2B27; color: white; border: none; border-radius: 12px;
        padding: 6px 14px; font-size: 13px; font-weight: bold; cursor: pointer;
      }

        display: flex; flex-direction: column; align-items: center; gap: 22px
